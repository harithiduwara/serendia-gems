name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.9'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # 66 unit tests, including the data-integrity and copy-provenance rules
      # that guard the catalogue (docs/04-test-plan.md §2.1).
      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # 52 HTTP checks against the built artefact: routes, structured data,
      # security headers, the enquiry API and its rate limiting.
      - name: Smoke suite
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          npm run smoke
