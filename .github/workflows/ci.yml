name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same file Cloudflare's build reads, so CI tests the runtime that deploys.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unit tests, including the data-integrity and copy-provenance rules
      # that guard the catalogue (docs/04-test-plan.md §2.1).
      - name: Unit tests
        run: npm test

      - name: Production build
        # Build with a site URL matching where the smoke suite serves it, so
        # canonical/og/sitemap URLs are self-consistent and the smoke suite's
        # "points at this deployment" checks are meaningful here too.
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      # HTTP checks against the built artefact: routes, structured data,
      # security headers, the enquiry API and its rate limiting.
      - name: Smoke suite
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          npm run smoke

  cloudflare:
    name: Cloudflare build under the Workers runtime
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Exactly the command Cloudflare runs in production — including its own
      # unit-test gate and output checks.
      - name: Build for Cloudflare
        run: npm run build:cloudflare

      # Validates wrangler.jsonc against the schema without needing an account.
      - name: Validate Wrangler config
        run: npx wrangler deploy --dry-run

      # Serves ./out with workerd — Cloudflare's actual runtime — so routing,
      # trailing-slash redirects, the 404 page and the _headers rules are all
      # tested the way production applies them, not approximated.
      - name: Smoke suite under workerd
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8787/ && break
            sleep 1
          done
          npm run smoke:cloudflare || { echo '--- wrangler log ---'; cat wrangler.log; exit 1; }
