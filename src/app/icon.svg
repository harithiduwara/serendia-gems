    <path d="M21.5 21.3 42 15.5 21.5 50Z" fill="#0B1838" fill-opacity="0.75"/>
    <path d="M21.5 2 42 15.5 21.5 50 1 15.5Z" fill="none" stroke="#C9A961" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
